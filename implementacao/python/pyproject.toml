[project]
name = "garantia-de-prazo"
version = "0.1.0"
description = "Regra de cálculo do crédito da Garantia de Prazo (RF01 a RF04)"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
